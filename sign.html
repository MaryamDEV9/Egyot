<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="bootstrap/css/all.min.css">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css.map">
    <link rel="stylesheet" href="css/sign.css">
</head>
<body>
    <div class="container">
        <div class="d-flex align-items-center flex-column justify-content-between mt-5 ">
            <h2>Sign up</h2>
            <form action="" class="d-flex flex-column w-50">
                <label for="name">Name</label>
                <input type="text" id="name">
                <label for="name">Email</label>
                <input type="email" id="email" >
                <label for="pass">Password</label>
                <input type="password" id="pass">
                <label for="age">Age group</label>
                <select name="" id="age">
                    <option value="">Chiled</option>
                    <option value="">Teneeger</option>
                    <option value="">Adult</option>
                </select>
                <button type="button" class="btn mt-5">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="bootstrap/js/all.min.js"></script>
    <script src="bootstrap/js/bootstrap.bundle.js"></script>
    <script src="bootstrap/js/bootstrap.bundle.js.map"></script>
</body>
</html>
