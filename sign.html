<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/sign.css" />
  </head>
  <body>
    <main>
      <div class="x"></div>
      <form class="text-light">
        <img src="src/Eye_of_Horus_bw.svg.png" alt="">
        <h1 class="fs-3 fw-bolder">Sign up</h1>
        <label for="name">Username</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Enter your name"
          required
        />
        <label for="pass">Password</label>
        <input
          id="pass"
          name="pass"
          type="password"
          placeholder="Enter your password"
          required
        />
        <label for="mail">Email</label>
        <input
          id="mail"
          name="mail"
          type="email"
          placeholder="Enter your email"
          required
        />
        <label for="age">Age</label>
        <select name="age" id="age">
          <option value="child">Chiled</option>
          <option value="Teneeger" selected>Teneeger</option>
          <option value="Adult">Adult</option>
        </select>
        <button type="submit" class="fs-5 w-50 btn butn">Sign up</button>
        <p class="mb-0 w-75 text-center">
          You alreadey have an account?
          <a href="log.html" style="color: #FE7743;">Log in</a>
        </p>
      </form>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
